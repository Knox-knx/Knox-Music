[package]
name = "knox-music"
version = "1.0.3"
description = "KNOX Music — local-first desktop music. Your device is the server."
authors = ["KNOX"]
edition = "2021"

[lib]
name = "knox_music"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# NOTE: default-features is OFF on purpose — tray/icon features need
# libayatana-appindicator3-dev + librsvg2-dev which are not guaranteed on
# minimal build hosts. Desktop tray integration (spec §32, post-stabilization)
# can re-enable them. Core window + IPC + opener need only webkit2gtk/gtk.
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "sync", "io-util"] }
axum = { version = "0.7", features = ["json", "query", "tokio"] }
tower-http = { version = "0.5", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rand = "0.8"
http = "1"

[features]
default = []

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
